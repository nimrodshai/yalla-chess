name: Keep alive

# Render's free tier spins a service down after 15 minutes without inbound
# traffic and takes about a minute to come back. This hits the health check
# every ten minutes so visitors never see that cold start.
#
# Two things to know about GitHub's scheduler:
# - Runs are often several minutes late, especially at the top of the hour,
#   so the schedule avoids :00 and leaves a 5-minute margin under 15.
# - GitHub disables scheduled workflows in a public repository after 60 days
#   without a commit. Any push to main re-enables it; the CI badge going grey
#   on this workflow is the sign it happened.

on:
  schedule:
    - cron: '7-59/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        env:
          # Override with a repository variable named KEEPALIVE_URL if the
          # domain ever changes.
          URL: ${{ vars.KEEPALIVE_URL || 'https://yallachessacademy.com/healthz' }}
        run: |
          # A sleeping instance answers the first request only after it has
          # booted, which can take a minute. Retry so a slow wake still counts
          # as a successful ping, and fail loudly if the site is actually down.
          curl --fail --silent --show-error \
            --max-time 90 \
            --retry 4 --retry-delay 15 --retry-all-errors \
            --write-out 'HTTP %{http_code} in %{time_total}s\n' \
            --output /dev/null \
            "$URL"
