# Litestream replica configuration. Mounted into the image at
# /etc/litestream.yml and read by deploy/entrypoint.sh.
#
# Why this exists: Render only attaches persistent disks to paid instances. On
# the free tier the filesystem is wiped on every deploy, restart and spin-down.
# Litestream restores the SQLite file from object storage at boot, then streams
# every committed WAL frame back out, so the free instance behaves as if it had
# a disk. Worst case on a hard kill is losing the last second of writes.
#
# Every value is an environment variable, expanded by Litestream itself, so this
# file holds no secrets and is safe to commit. Backblaze B2 is the intended
# target (10 GB free, no card), but any S3-compatible bucket works.

access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}

# A fresh snapshot every 6 hours keeps restores fast and bounds how much WAL a
# boot has to replay. Retention is how far back point-in-time restore reaches.
snapshot:
  interval: 6h
  retention: 72h

# Listing the bucket is what the B2 free tier rations: 2,500 Class C calls a
# day, after which every call, including the restore at boot, fails with
# "Transaction cap exceeded" and the service cannot start. Litestream's
# background loops list the bucket on a timer whether or not anything changed,
# and the defaults (an L0 cleanup check every 15s that lists twice, an L1
# compaction every 30s) come to well over 10,000 lists a day on an idle site
# that the keep-alive ping never lets sleep. These intervals bring that to a
# few hundred. Durability is unaffected: every write is still uploaded within
# sync-interval, and uploads are Class A calls, which are free. The cost is
# only that a restore fetches more small files instead of a few compacted ones.
l0-retention-check-interval: 1h
levels:
  - interval: 15m
  - interval: 3h
  - interval: 24h

dbs:
  - path: ${DATA_DIR}/${DB_FILE}
    # Litestream performs checkpoints itself after shipping frames. The
    # application's busy_timeout (5 s) covers the brief write lock this takes.
    checkpoint-interval: 1m
    replica:
      type: s3
      bucket: ${LITESTREAM_BUCKET}
      path: ${LITESTREAM_PATH}
      # For B2 this is s3.<region>.backblazeb2.com, e.g. s3.eu-central-003.
      # Path-style addressing works for B2, MinIO (used in CI) and AWS alike.
      endpoint: ${LITESTREAM_ENDPOINT}
      force-path-style: true
      # Frames are uploaded at most this often, and only when something changed.
      # The listing loops above run regardless; see the comment on levels.
      sync-interval: 1s
