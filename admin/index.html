  <link rel="stylesheet" href="/admin/admin.css">
  <script>
    (function () {
      var lang = 'he';
      try { lang = localStorage.getItem('yallaChessLanguage') || 'he'; } catch (e) {}
      if (lang !== 'he' && lang !== 'en') lang = 'he';
      document.documentElement.setAttribute('lang', lang);
      document.documentElement.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');
      window.__initialLang = lang;
      // The theme is set before the first paint so a dark page never
      // flashes light: the saved choice, else the system's.
      var theme = '';
      try { theme = localStorage.getItem('yallaChessTheme') || ''; } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
