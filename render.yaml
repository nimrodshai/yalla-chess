# Render Blueprint. In the Render dashboard: New -> Blueprint -> pick this repo,
# and Render creates the service below. Values marked `sync: false` are
# prompted for once and stored as secrets; everything else is version-controlled.
#
# The database is one SQLite file. Render only attaches persistent disks to
# paid instances, so on the `free` plan the file is replicated to a Backblaze
# B2 bucket with Litestream instead (see deploy/litestream.yml): restored at
# boot, streamed out on every write. Free instances also sleep after 15 idle
# minutes; .github/workflows/keepalive.yml pings /healthz to prevent that.
#
# To move to a paid plan later: set `plan: starter`, uncomment the `disk`
# block, and leave the LITESTREAM_* variables in place so the replica becomes
# an off-site backup of the disk.
services:
  - type: web
    name: yalla-chess
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    # disk:
    #   name: yalla-chess-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8001"
      - key: DATA_DIR
        value: /data
      - key: PUBLIC_ORIGIN
        value: https://yallachessacademy.com
      # Render's proxy sets X-Forwarded-For, so rate limits see real clients.
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info
      # Litestream replica. The bucket and endpoint are not secrets, but they
      # are account-specific, so they are prompted for too. The key needs
      # read, write, list and delete on this one bucket. Clearing
      # LITESTREAM_BUCKET disables replication entirely.
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ENDPOINT
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
      # Twilio Verify, required: the server refuses to boot without it.
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      # Contact-form email, optional. Leave blank to skip.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: CONTACT_NOTIFY_TO
        sync: false
      # First teacher account. Clear this in the dashboard after the first boot.
      - key: BOOTSTRAP_TEACHER_PHONE
        sync: false
